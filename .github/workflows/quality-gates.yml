name: WFM Quality Gates

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "wfm-build-check-placeholder"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Build Next.js application
        run: npm run build

  sql-resubmission-test:
    if: github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'feat/representation-claims-security')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wfm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wfm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run representation resubmission SQL tests
        env:
          PGPASSWORD: postgres
        run: |
          migration_file="$(find supabase/migrations -maxdepth 1 -type f -name '*_representation_request_resubmission.sql' -print -quit)"
          if [ -z "$migration_file" ]; then
            echo "Expected timestamped resubmission migration was not found."
            exit 1
          fi
          psql -h localhost -U postgres -d wfm_test -v ON_ERROR_STOP=1 -v migration_file="$migration_file" -f tests/sql/representation-request-resubmission-test.sql
